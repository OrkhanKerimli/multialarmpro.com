<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MultiAlarm Pro - Never Oversleep Again</title>
    <meta name="description" content="The ultimate alarm app for heavy sleepers. Math puzzles, unlimited alarms, and smart features to ensure you wake up on time.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FFD60A;
            --primary-dark: #E6C200;
            --dark: #1a1a1a;
            --gray-100: #F5F5F7;
            --gray-200: #E8E8ED;
            --gray-400: #86868B;
            --gray-600: #6E6E73;
            --white: #FFFFFF;
            --bg: #FAFAFA;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-height: 100vh;
        }

        /* Main Container */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 24px;
            max-height: 100vh;
        }

        /* Logo & Title */
        .brand {
            text-align: center;
        }

        .brand h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .brand p {
            font-size: clamp(0.875rem, 2vw, 1rem);
            color: var(--gray-600);
            font-weight: 500;
        }

        /* Flip Clock */
        .clock-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flip-clock {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .flip-clock .separator {
            font-size: clamp(36px, 8vw, 56px);
            font-weight: bold;
            color: var(--dark);
            padding: 0 4px;
            opacity: 0.3;
        }

        .flip-unit-container {
            display: flex;
            gap: 4px;
        }

        .flip-unit {
            position: relative;
            width: clamp(50px, 12vw, 80px);
            height: clamp(70px, 16vw, 110px);
            perspective: 300px;
        }

        .flip-card {
            position: absolute;
            width: 100%;
            height: 50%;
            overflow: hidden;
            backface-visibility: hidden;
        }

        .flip-card-inner {
            position: absolute;
            width: 100%;
            height: 200%;
            background: linear-gradient(180deg, var(--dark) 0%, #2d2d2d 100%);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(36px, 9vw, 60px);
            font-weight: 800;
            color: var(--white);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .flip-card.top {
            top: 0;
            z-index: 1;
        }

        .flip-card.top .flip-card-inner {
            top: 0;
            border-radius: 10px 10px 0 0;
        }

        .flip-card.bottom {
            bottom: 0;
            z-index: 1;
        }

        .flip-card.bottom .flip-card-inner {
            bottom: 0;
            border-radius: 0 0 10px 10px;
        }

        .flip-unit::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .flip-card.flip-top {
            top: 0;
            z-index: 3;
            transform-origin: bottom;
            animation: flipTop 0.3s ease-in forwards;
        }

        .flip-card.flip-top .flip-card-inner {
            top: 0;
            border-radius: 10px 10px 0 0;
        }

        .flip-card.flip-bottom {
            bottom: 0;
            z-index: 2;
            transform-origin: top;
            transform: rotateX(90deg);
            animation: flipBottom 0.3s ease-out 0.3s forwards;
        }

        .flip-card.flip-bottom .flip-card-inner {
            bottom: 0;
            border-radius: 0 0 10px 10px;
        }

        .period {
            font-size: clamp(18px, 4vw, 26px);
            font-weight: 700;
            color: var(--dark);
            margin-left: 12px;
            opacity: 0.6;
        }

        @keyframes flipTop {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipBottom {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        /* Features */
        .features {
            display: flex;
            justify-content: center;
            gap: clamp(16px, 4vw, 32px);
            flex-wrap: wrap;
            max-width: 700px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--white);
            padding: 12px 18px;
            border-radius: 100px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--gray-200);
        }

        .feature-icon {
            width: 28px;
            height: 28px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-icon svg {
            width: 14px;
            height: 14px;
            fill: var(--dark);
        }

        .feature span {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--dark);
            white-space: nowrap;
        }

        /* CTA */
        .cta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .app-store-btn {
            transition: transform 0.3s ease;
        }

        .app-store-btn:hover {
            transform: scale(1.05);
        }

        .app-store-btn img {
            height: 48px;
        }

        /* Footer */
        footer {
            padding: 16px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            border-top: 1px solid var(--gray-200);
            background: var(--white);
        }

        footer a {
            color: var(--gray-600);
            text-decoration: none;
            font-size: 0.8125rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: var(--dark);
        }

        footer .divider {
            color: var(--gray-200);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                gap: 20px;
                padding: 16px;
            }

            .features {
                gap: 10px;
            }

            .feature {
                padding: 10px 14px;
            }

            .feature-icon {
                width: 24px;
                height: 24px;
            }

            .feature-icon svg {
                width: 12px;
                height: 12px;
            }

            .feature span {
                font-size: 0.8125rem;
            }

            footer {
                padding: 12px 16px;
                gap: 16px;
            }

            footer a {
                font-size: 0.75rem;
            }
        }

        @media (max-height: 600px) {
            .container {
                gap: 16px;
            }

            .flip-unit {
                width: 45px;
                height: 62px;
            }

            .flip-card-inner {
                font-size: 32px;
            }

            .flip-clock .separator {
                font-size: 32px;
            }

            .period {
                font-size: 16px;
            }

            .feature {
                padding: 8px 12px;
            }

            .app-store-btn img {
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Brand -->
        <div class="brand">
            <h1>MultiAlarm Pro</h1>
            <p>Never oversleep again</p>
        </div>

        <!-- Flip Clock -->
        <div class="clock-wrapper">
            <div class="flip-clock">
                <div class="flip-unit-container" id="hours">
                    <div class="flip-unit" id="hour-tens">
                        <div class="flip-card top">
                            <div class="flip-card-inner">0</div>
                        </div>
                        <div class="flip-card bottom">
                            <div class="flip-card-inner">0</div>
                        </div>
                    </div>
                    <div class="flip-unit" id="hour-ones">
                        <div class="flip-card top">
                            <div class="flip-card-inner">0</div>
                        </div>
                        <div class="flip-card bottom">
                            <div class="flip-card-inner">0</div>
                        </div>
                    </div>
                </div>

                <span class="separator">:</span>

                <div class="flip-unit-container" id="minutes">
                    <div class="flip-unit" id="minute-tens">
                        <div class="flip-card top">
                            <div class="flip-card-inner">0</div>
                        </div>
                        <div class="flip-card bottom">
                            <div class="flip-card-inner">0</div>
                        </div>
                    </div>
                    <div class="flip-unit" id="minute-ones">
                        <div class="flip-card top">
                            <div class="flip-card-inner">0</div>
                        </div>
                        <div class="flip-card bottom">
                            <div class="flip-card-inner">0</div>
                        </div>
                    </div>
                </div>

                <span class="separator">:</span>

                <div class="flip-unit-container" id="seconds">
                    <div class="flip-unit" id="second-tens">
                        <div class="flip-card top">
                            <div class="flip-card-inner">0</div>
                        </div>
                        <div class="flip-card bottom">
                            <div class="flip-card-inner">0</div>
                        </div>
                    </div>
                    <div class="flip-unit" id="second-ones">
                        <div class="flip-card top">
                            <div class="flip-card-inner">0</div>
                        </div>
                        <div class="flip-card bottom">
                            <div class="flip-card-inner">0</div>
                        </div>
                    </div>
                </div>

                <span class="period" id="period"></span>
            </div>
        </div>

        <!-- Features -->
        <div class="features">
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14h-2v-4H8v-2h4V7h2v4h4v2h-4v4z"/></svg>
                </div>
                <span>Math Puzzles</span>
            </div>
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                </div>
                <span>Unlimited Alarms</span>
            </div>
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <span>Premium Sounds</span>
            </div>
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18z"/></svg>
                </div>
                <span>Quick Alarm</span>
            </div>
        </div>

        <!-- CTA -->
        <div class="cta">
            <a href="https://apps.apple.com/us/app/loud-alarm-multialarm-pro/id6756498671" class="app-store-btn" target="_blank" rel="noopener noreferrer">
                <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <a href="alarmpro_privacy_policy.html">Privacy Policy</a>
        <span class="divider">|</span>
        <a href="alarmpro_terms_of_use.html">Terms of Use</a>
    </footer>

    <script>
        class FlipClock {
            constructor() {
                this.hourTens = document.getElementById('hour-tens');
                this.hourOnes = document.getElementById('hour-ones');
                this.minuteTens = document.getElementById('minute-tens');
                this.minuteOnes = document.getElementById('minute-ones');
                this.secondTens = document.getElementById('second-tens');
                this.secondOnes = document.getElementById('second-ones');
                this.periodElement = document.getElementById('period');

                this.prevTime = {
                    hourTens: -1,
                    hourOnes: -1,
                    minuteTens: -1,
                    minuteOnes: -1,
                    secondTens: -1,
                    secondOnes: -1
                };

                this.use12Hour = this.detectTimeFormat();
                this.update();
                setInterval(() => this.update(), 1000);
            }

            detectTimeFormat() {
                const testDate = new Date(2000, 0, 1, 13, 0, 0);
                const formatted = testDate.toLocaleTimeString();
                return !formatted.includes('13');
            }

            update() {
                const now = new Date();
                let hour = now.getHours();
                let period = '';

                if (this.use12Hour) {
                    period = hour >= 12 ? 'PM' : 'AM';
                    hour = hour % 12;
                    if (hour === 0) hour = 12;
                    this.periodElement.textContent = period;
                }

                const hours = String(hour).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');

                this.flipTo(this.hourTens, hours[0], 'hourTens');
                this.flipTo(this.hourOnes, hours[1], 'hourOnes');
                this.flipTo(this.minuteTens, minutes[0], 'minuteTens');
                this.flipTo(this.minuteOnes, minutes[1], 'minuteOnes');
                this.flipTo(this.secondTens, seconds[0], 'secondTens');
                this.flipTo(this.secondOnes, seconds[1], 'secondOnes');
            }

            flipTo(element, value, key) {
                if (this.prevTime[key] === value) return;

                const topCard = element.querySelector('.flip-card.top .flip-card-inner');
                const bottomCard = element.querySelector('.flip-card.bottom .flip-card-inner');

                const oldFlipTop = element.querySelector('.flip-top');
                const oldFlipBottom = element.querySelector('.flip-bottom');
                if (oldFlipTop) oldFlipTop.remove();
                if (oldFlipBottom) oldFlipBottom.remove();

                if (this.prevTime[key] !== -1) {
                    const flipTop = document.createElement('div');
                    flipTop.className = 'flip-card flip-top';
                    flipTop.innerHTML = `<div class="flip-card-inner">${this.prevTime[key]}</div>`;

                    const flipBottom = document.createElement('div');
                    flipBottom.className = 'flip-card flip-bottom';
                    flipBottom.innerHTML = `<div class="flip-card-inner">${value}</div>`;

                    element.appendChild(flipTop);
                    element.appendChild(flipBottom);

                    topCard.textContent = value;

                    setTimeout(() => {
                        bottomCard.textContent = value;
                        flipTop.remove();
                        flipBottom.remove();
                    }, 600);
                } else {
                    topCard.textContent = value;
                    bottomCard.textContent = value;
                }

                this.prevTime[key] = value;
            }
        }

        new FlipClock();
    </script>
</body>
</html>
